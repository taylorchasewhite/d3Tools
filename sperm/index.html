<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Flocking with Sperm</title>
	<style>
		body { margin: 8px; background: #000; color: #fff; font-family: sans-serif; }
		svg { display: block; width: 100%; height: auto; }
		ellipse { fill: #fff; }
		path { fill: none; stroke: #fff; stroke-linecap: round; }
		.mid { stroke-width: 4px; }
		.tail { stroke-width: 2px; }
		button { margin: 3px 4px 5px 0; padding: 6px 12px; border: 0; border-radius: 3px; color: #fff; font-size: 18px; cursor: pointer; }
		#btnAdd { background: #187b43; }
		#btnRemove { background: #b82e22; }
		button:disabled { opacity: 0.5; cursor: default; }
		#btnReset { background: #245c98; font-size: 14px; }
		#controls { padding: 8px; border: 1px solid #555; border-radius: 4px; }
		#strengths, #advanced { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px; }
		.control { display: grid; grid-template-columns: 1fr auto; gap: 4px; }
		.control input, .control small { grid-column: 1 / -1; width: 100%; margin: 0; }
		.control small { color: #bbb; }
		output { font-variant-numeric: tabular-nums; }
		summary { cursor: pointer; margin: 10px 0; }
		#controls p { font-size: 13px; margin: 8px 0; }
	</style>
</head>
<body>
	<button id="btnAdd" type="button" title="Add a swimmer">Deposit</button>
	<button id="btnRemove" type="button" title="Remove a swimmer">Withdraw</button>
	<span id="population" role="status" aria-live="polite"></span>
	<section id="controls" hidden aria-label="Live flocking settings">
		<div id="strengths"></div>
		<p>Changes apply live. Set a strength to zero to disable that rule.</p>
		<details>
			<summary>Advanced controls</summary>
			<div id="advanced"></div>
		</details>
		<button id="btnReset" type="button">Reset defaults</button>
	</section>
	<div id="simulation"></div>
	<script src="https://d3js.org/d3.v3.min.js"></script>
	<script src="boids.js"></script>
	<script src="sperm.js"></script>
</body>
</html>
